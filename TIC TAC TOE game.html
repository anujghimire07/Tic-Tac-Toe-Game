<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:ital,wght@0,400;0,500;0,600;0,700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #DBAD6A;
            font-family: 'DynaPuff';
            text-shadow: 2px 5px 1px black;
            text-align: center;
        }

        #title {
            color: rgb(255, 254, 253);
            padding: 10px;
            font-size: 50px;

        }

        .message_container {
            display: grid;
            justify-content: center;
            align-items: center;
        }


        .messageproperties {
            background-color: #5A352A;
            font-family: 'DynaPuff';
            text-shadow: 2px 1px 1px black;
            text-align: center;
            color: rgb(255, 254, 253);
            padding: 2vmin;
            margin: 1vmin;
            border: 1vmin;
            width: 200px;
            border-radius: 40px;


        }

        .container {
            height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5vmin;
        }

        .game {
            height: 60vmin;
            width: 60vmin;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 1.5vmin;
        }

        .box {
            height: 18vmin;
            width: 18vmin;
            border-radius: 0.5rem;
            border: none;
            box-shadow: 1px 2px 2px rgb(25, 24, 24);
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #EFFFC8;
        }

        #reset {
            padding: 1rem;
            font-size: 1.5rem;
            background-color: #B96D40;
            border-radius: 1rem;
            border: none;
            font-family: 'DynaPuff';
            color: #EDF2EF;
            text-shadow: 1px 2px 2px black;
            box-shadow: 1px 1px 1px black
        }

        #reset:hover {
            background-color: #D34E24;
            transition: 0.2s background-color ease-in-out;
        }

        #newgame {
            padding: 1rem;
            font-size: 1.5rem;
            background-color: #B96D40;
            border-radius: 1rem;
            border: none;
            font-family: 'DynaPuff';
            color: #EDF2EF;
            text-shadow: 1px 2px 2px black;
            box-shadow: 1px 1px 1px black
        }

        .circle {
            width: 50px;
            height: 50px;
            border: 7px solid #5A352A;
            border-radius: 50%;
        }

        .cross {
            width: 100px;
            height: 100px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* X shape */
        .cross::before,
        .cross::after {
            content: "";
            position: absolute;
            width: 70%;
            height: 8px;
            background-color: #5A352A;
        }

        .cross::before {
            transform: rotate(45deg);
        }

        .cross::after {
            transform: rotate(-45deg);
        }

        .hidereset {
            display: none;
        }

        .hidenewgame {
            display: none;
        }

        .hidemessage {
            display: none;
        }
    </style>
</head>

<body>
    <h1 id="title">TIC TAK TOE</h1>
    <div class="message_container">
        <h2 class="message hidemessage"></h2>
    </div>
    <div class="container">
        <div class="game">
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
        </div>
    </div>
    <button id="reset">RESET</button>
    <button id="newgame" class="hidenewgame">NEW GAME</button>
</body>
<script>
    let box = document.querySelectorAll(".box")
    let reset = document.querySelector("#reset")
    let message = document.querySelector(".message")//i could also use getElementByID but not classname
    let newgame = document.querySelector("#newgame")
    let turnO = true;
    let count = 0
    //specifying winning conditions
    const winpatterns = [
        [0, 1, 2],
        [0, 3, 6],
        [0, 4, 8],
        [1, 4, 7],
        [2, 5, 8],
        [2, 4, 6],
        [3, 4, 5],
        [6, 7, 8]
    ]

    //adding eventListeners to each box
    box.forEach(element => {
        element.addEventListener("click", startgame)
        function startgame() {
            if (turnO) {
                element.innerHTML = "<div class='circle'></div>"//player O
                turnO = false
            }
            else {
                element.innerHTML = "<div class='cross'></div>"//player X
                turnO = true
            }
            element.disabled = true
            count++
            console.log(count)
            if (count === 9) {
                count = 0
                turnO = true
                message.innerText = "DRAW!"
                message.classList.remove("hidemessage")
                message.classList.add("messageproperties")
            }
            CheckWinner();

        }
    })


    //checking winner after every move
    function CheckWinner() {
        for (let patterns of winpatterns) {
            /* console.log(patterns[0], patterns[1], patterns[2])
             console.log(
                 box[patterns[0]].innerHTML,
                 box[patterns[1]].innerHTML,
                 box[patterns[2]].innerHTML) */

            let Pos1Val = box[patterns[0]].innerHTML
            let Pos2Val = box[patterns[1]].innerHTML
            let Pos3Val = box[patterns[2]].innerHTML

            if (Pos1Val != "" && Pos2Val != "" && Pos3Val != "") {
                if (Pos1Val === Pos2Val && Pos2Val === Pos3Val) {
                    if (turnO) {
                        Pos1Val = "X"
                    }
                    else {
                        Pos1Val = "O"
                    }
                    showwinner(Pos1Val)
                }

            }


        }
    }


    //disables all boxes after winning
    function disableall() {
        for (let allboxes of box) {
            allboxes.disabled = true
        }
    }

    //enables all boxes to reset game
    function enableall() {
        for (const allboxes of box) {
            allboxes.disabled = false
            allboxes.innerText = ""
        }
    }

    //announcing the winner
    function showwinner(winner) {
        message.innerText = `The winner is ${winner}`
        disableall()
        reset.classList.add("hidereset")
        newgame.classList.remove("hidenewgame")
        message.classList.remove("message")
        message.classList.remove("hidemessage")
        message.classList.add("messageproperties")
    }

    //reset button: reset the game
    reset.addEventListener("click", resetgame)
    function resetgame() {
        count = 0
        turnO = true
        message.innerText = ""
        enableall()
        message.classList.remove("messageproperties")
        message.classList.add("hidemessage")
        /* box.forEach(element=>{
             element.innerText=""
         }) 
             i could also do this instead of allboxes.innerText="" in enableall() */
    }
    newgame.addEventListener("click", after_clicking_newgame)
    function after_clicking_newgame() {
        turnO = true
        count = 0
        message.innerText = ""
        newgame.classList.add("hidenewgame")
        reset.classList.remove("hidereset")
        message.classList.remove("messageproperties")
        enableall()
    }

</script>

</html>
